name: Regression tests

on:
  push:
  pull_request:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  DEBUG: 'True'

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip check
      - name: Check candidate files for private environment files and eBay credentials
        run: python scripts/check_secrets.py
      - name: Check Django and migration consistency
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run backend regression and Sprint 7 integration tests
        working-directory: backend
        run: python manage.py test

  frontend:
    name: Frontend + integration (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt
      - name: Install application and integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r frontend/requirements.txt
          python -m pip check
      - name: Run frontend tests (required)
        working-directory: frontend
        run: python -m pytest -v --durations=10 --basetemp="$RUNNER_TEMP/pytest"
      - name: Upload test server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-server-logs
          path: ${{ runner.temp }}/pytest/**/server.log
          if-no-files-found: ignore

  startup:
    name: Clean checkout startup
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt
      - name: Install dependencies from the clean checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r frontend/requirements.txt
          python -m pip check
      - name: Migrate disposable database and start both real applications
        run: python scripts/smoke_start.py

  release:
    name: Sprint 7 release gate
    if: ${{ always() }}
    needs: [backend, frontend, startup]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          STARTUP_RESULT: ${{ needs.startup.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$STARTUP_RESULT" = success